name: CI

# Integración continua del backend. Se ejecuta en pull requests y es reutilizable
# desde cd.yml para que ninguna imagen se publique sin haber pasado estas verificaciones.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Una sola ejecución vigente por pull request; las superadas se cancelan.
# Fuera de pull_request cada ejecución usa su propio grupo para no colisionar con el llamador.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Debe coincidir con Microsoft.EntityFrameworkCore en Directory.Packages.props y con el Dockerfile.
  DOTNET_EF_VERSION: "10.0.12"

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore AulaVirtual.sln

      - name: Build (Release)
        run: dotnet build AulaVirtual.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test AulaVirtual.sln
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  code-style:
    name: Code style (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo: el código base heredado todavía incumple .editorconfig. Los hallazgos se
    # reportan como aviso y resumen, sin marcar el job en rojo ni bloquear la integración.
    # Para hacerlo obligatorio: formatear el repositorio, quitar la captura de código de
    # salida del paso final y agregar este job a "needs" de ci-passed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - run: dotnet restore AulaVirtual.sln

      - name: Verify formatting (report only)
        run: |
          status=0
          dotnet format AulaVirtual.sln --verify-no-changes --no-restore --verbosity minimal > format-report.txt 2>&1 || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "Formatting conforms to .editorconfig."
            exit 0
          fi
          findings=$(grep -c ": error " format-report.txt || true)
          echo "::warning title=Code style::${findings} formatting finding(s) against .editorconfig (advisory, not blocking). See the job summary."
          {
            echo "### Code style (advisory)"
            echo
            echo "${findings} finding(s) reported by \`dotnet format --verify-no-changes\`. This check does not block the pull request."
            echo
            echo "Findings by rule:"
            echo '```'
            grep -o "error [A-Z]*:" format-report.txt | sort | uniq -c | sort -rn
            echo '```'
            echo
            echo "Findings by file (first 25):"
            echo '```'
            grep ": error " format-report.txt | sed -E 's#^.*/aula_mf_backend/aula_mf_backend/##; s#\([0-9]+,[0-9]+\).*##' | sort | uniq -c | sort -rn | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - run: dotnet restore AulaVirtual.sln

      - name: Fail on vulnerable packages (direct and transitive)
        run: |
          dotnet list AulaVirtual.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected. See the log above."
            exit 1
          fi

      - name: Report deprecated packages
        run: dotnet list AulaVirtual.sln package --deprecated

  database:
    name: Migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aula_virtual_dev
          POSTGRES_USER: aula
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aula -d aula_virtual_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aula_virtual_dev;Username=aula;Password=ci_only_password
      AUTHORIZATION_BOOTSTRAP_TEST_CONNECTION: Host=localhost;Port=5432;Database=aula_virtual_dev;Username=aula;Password=ci_only_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "$DOTNET_EF_VERSION"

      - run: dotnet restore AulaVirtual.sln

      - name: Detect model changes without a migration
        run: |
          for entry in Users:UsersDbContext Auth:AuthDbContext Authorization:AuthorizationDbContext Courses:CoursesDbContext; do
            module="${entry%%:*}"; context="${entry##*:}"
            echo "Checking ${context}"
            dotnet ef migrations has-pending-model-changes \
              --project "src/Modules/${module}/AulaVirtual.Modules.${module}.Infrastructure" \
              --context "${context}"
          done

      - name: Apply migrations to an empty database
        run: sh docker/migrate.sh

      - name: Provision authorization catalog
        run: >
          dotnet run --project tools/AulaVirtual.AuthorizationProvisioning --
          provision-catalog --confirm-authorization-change

      - name: PostgreSQL integration tests
        run: >
          dotnet test tests/AulaVirtual.Modules.Authorization.Tests
          --filter "FullyQualifiedName~BootstrapConcurrencyIntegrationTests"
          --logger "console;verbosity=normal"

  container:
    name: Container image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_password/' .env
          sed -i 's/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=ci-only-signing-key-0123456789-abcdefghij/' .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API and check health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5087/health; then
              echo
              echo "API healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::The API did not become healthy in time."
          exit 1

      - name: Smoke test a database-backed public endpoint
        run: curl --fail --silent --show-error http://localhost:5087/api/v1/public/courses

      - name: Dump logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  # Único check a marcar como obligatorio en la protección de la rama main.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [build-and-test, dependency-audit, database, container]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::One or more required jobs did not succeed."
              exit 1
            fi
          done
