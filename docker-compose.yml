# Entorno local: PostgreSQL + migraciones + API.
#   docker compose up -d --build
# Datos de prueba (cuentas dev y catálogo de permisos):
#   docker compose --profile tools run --rm provision
name: aulavirtual

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aula_virtual_dev}
      POSTGRES_USER: ${POSTGRES_USER:-aula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    command: ["sh", "docker/migrate.sh"]
    environment:
      ConnectionStrings__DefaultConnection: &conn Host=postgres;Port=5432;Database=${POSTGRES_DB:-aula_virtual_dev};Username=${POSTGRES_USER:-aula};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-5087}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: *conn
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?define JWT_SIGNING_KEY en .env (32+ caracteres)}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Comparte la red de postgres para que la herramienta vea el host como "localhost".
  provision:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    network_mode: "service:postgres"
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=${POSTGRES_DB:-aula_virtual_dev};Username=${POSTGRES_USER:-aula};Password=${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - >
        dotnet run --project tools/AulaVirtual.AuthorizationProvisioning -- provision-catalog --confirm-authorization-change &&
        dotnet run --project tools/AulaVirtual.DevProvisioning -- --confirm-development-provisioning
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
